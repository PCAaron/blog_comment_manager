<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>博客评论外链管理器 - 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="optionsTitle">博客评论外链管理器 - 设置</h1>

    <!-- 卡片一：AI 服务 -->
    <section class="card">
      <h2 data-i18n="aiServiceCardTitle">AI 服务</h2>
      <div class="provider-row" id="ai-provider-row">
        <label class="provider-opt"><input type="radio" name="ai-provider" value="deepseek" /> <span data-i18n="aiProviderDeepseek">DeepSeek</span></label>
        <label class="provider-opt"><input type="radio" name="ai-provider" value="openrouter" /> <span data-i18n="aiProviderOpenrouter">OpenRouter</span></label>
      </div>
      <p class="desc" data-i18n="aiPrivacyHint">页面摘录与表单 HTML 会发送至所选服务商的 API；Key 仅保存在本机。</p>
      <div id="key-panel-deepseek" class="key-panel row">
        <input type="password" id="deepseek-key" data-i18n-ph="deepseekKeyPh" spellcheck="false" autocomplete="off" />
        <button type="button" id="btn-test-deepseek" class="btn btn-primary" data-i18n="testConn">测试连接</button>
      </div>
      <div id="key-panel-openrouter" class="key-panel row" hidden>
        <input type="password" id="api-key" data-i18n-ph="apiKeyPh" placeholder="sk-or-v1-..." spellcheck="false" autocomplete="off" />
        <button type="button" id="btn-test-openrouter" class="btn btn-primary" data-i18n="testConn">测试连接</button>
      </div>
      <div class="hint" id="test-result"></div>
    </section>

    <!-- 卡片二：模型配置 -->
    <section class="card">
      <h2 data-i18n="modelsCardTitle">模型配置</h2>
      <p class="desc" data-i18n="modelsProviderHint">模型 ID 随所选 AI 服务变化；切换服务时会自动重置为默认模型。</p>
      <div class="form-row">
        <label data-i18n="model_discover">链接发现模型</label>
        <div class="desc" data-i18n="model_discover_desc"></div>
        <input type="text" id="model-discover" spellcheck="false" />
      </div>
      <div class="form-row">
        <label data-i18n="model_classify">链接分类模型</label>
        <div class="desc" data-i18n="model_classify_desc"></div>
        <input type="text" id="model-classify" spellcheck="false" />
      </div>
      <div class="form-row">
        <label data-i18n="model_formDetect">表单识别模型</label>
        <div class="desc" data-i18n="model_formDetect_desc"></div>
        <input type="text" id="model-formdetect" spellcheck="false" />
      </div>
      <div class="form-row">
        <label data-i18n="model_commentGen">评论生成模型</label>
        <div class="desc" data-i18n="model_commentGen_desc"></div>
        <input type="text" id="model-commentgen" spellcheck="false" />
      </div>
    </section>

    <!-- 卡片三：发布身份 -->
    <section class="card">
      <h2 data-i18n="identityCardTitle">发布身份</h2>
      <p class="desc" data-i18n="identityCardDesc"></p>
      <div class="row three">
        <div class="form-row">
          <label data-i18n="idName">昵称</label>
          <input type="text" id="id-name" />
        </div>
        <div class="form-row">
          <label data-i18n="idEmail">邮箱</label>
          <input type="email" id="id-email" />
        </div>
        <div class="form-row">
          <label data-i18n="idWebsite">网址（默认落地链接）</label>
          <input type="text" id="id-website" placeholder="https://..." spellcheck="false" />
        </div>
      </div>
    </section>

    <!-- 卡片四：通用设置（语言 / 摘要语言 / AI 超时） -->
    <section class="card">
      <h2 data-i18n="generalCardTitle">通用设置</h2>
      <div class="row">
        <div class="form-row grow">
          <label data-i18n="languageLabel">界面语言</label>
          <select id="lang-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-row grow">
          <label data-i18n="summaryLangLabel">标题与摘要语言</label>
          <select id="summary-lang">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-row grow">
          <label data-i18n="aiTimeoutLabel">AI 请求超时（秒）</label>
          <input type="number" id="ai-timeout" min="5" max="300" step="5" />
        </div>
      </div>
    </section>

    <div id="saved-flash" data-i18n="saved">已保存</div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
